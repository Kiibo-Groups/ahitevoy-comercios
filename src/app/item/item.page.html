<ion-header no-border>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title *ngIf="text" color="light">
      {{ text.s_menu_title }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="data && text">

  <div *ngFor="let cate of data">
    <ion-card mode="ios" style="background-color: white;" *ngFor="let item of cate.items">
      <ion-card-content>
        <ion-row>
          <ion-col size="3"><img src="{{ item.img }}" style="width: 80%;margin-left: 10%"></ion-col>
          <ion-col size="7">
            {{ item.name }}<br />
            <small>{{ cate.cate_name }}</small>
          </ion-col>
          <ion-col size="2" *ngIf="item.status == 1"><ion-toggle color="success" mode="ios"
              (ionChange)="changeStatus(item.id,0)"></ion-toggle></ion-col>
          <ion-col size="2" *ngIf="item.status == 0"><ion-toggle color="success" mode="ios" checked="true"
              (ionChange)="changeStatus(item.id,1)"></ion-toggle></ion-col>
        </ion-row>
      </ion-card-content>
    </ion-card>
  </div>
 

</ion-content>
