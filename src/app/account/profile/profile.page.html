<ion-header translucent>
  <ion-toolbar color="light">
     <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title color="light">Mi Cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-page" *ngIf="data">

  <!-- Información principal -->
  <div class="profile-header" style="background-image:
      linear-gradient(to top, var(--ion-color-secondary) -80%, transparent 100%),
      url('https://dash.ahitevoy.com/upload/user/logo/{{ data.logo }}');">
    <div class="avatar-img" style="background-image: url('https://dash.ahitevoy.com/upload/user/{{ data.img }}');">
    </div>
  </div>

  <section class="ion-padding">
    <div class="profile-content">
      <h2>{{ data.name }}</h2>
      <p>{{ data.email }}</p>
      <small>{{ data.address}}</small>
    </div>

    <!-- Opciones -->
    <ion-list class="settings-list">
      <ion-item button>
        <ion-icon name="storefront-outline" slot="start" color="medium"></ion-icon>
        <ion-label>Status del negocio</ion-label>

        <ion-toggle color="success" *ngIf="data.open == 1" mode="ios" (ionChange)="storeOpen(0)"></ion-toggle>
        <ion-toggle color="success" *ngIf="data.open == 0" mode="ios" checked (ionChange)="storeOpen(1)"></ion-toggle>
      </ion-item>

      <ion-item button (click)="takeAction(1)">
        <ion-icon name="key-outline" slot="start" color="medium"></ion-icon>
        <ion-label>Cambiar contraseña</ion-label>
      </ion-item>


      <ion-item button (click)="deleteAccount()">
        <ion-icon name="trash-outline" slot="start" color="danger"></ion-icon>
        <ion-label>Eliminar cuenta</ion-label>
      </ion-item>

      <ion-item lines="full" (click)="logout()">
        <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
        <ion-label color="danger">Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>


    <ion-card mode="ios" *ngIf="action == 1">
      <form #form="ngForm" (ngSubmit)="update(form.value)">
        <ion-card-header>
          <ion-card-subtitle>Actualiza tu información</ion-card-subtitle>
        </ion-card-header>

        <ion-item>
          <ion-label position="floating">Cambiar contraseña</ion-label>
          <ion-input type="password" ngModel name="password"></ion-input>
        </ion-item>
        <br>

        <ion-button expand="block" mode="ios" type="submit" [disabled]="!form"
          style="width: 90%;margin-left: 5%">Actualizar</ion-button>
      </form>
    </ion-card>

  </section>
</ion-content>
