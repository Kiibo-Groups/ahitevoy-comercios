<ion-header no-border>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
<ion-back-button></ion-back-button>
</ion-buttons>
    
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="data">

<div style="background-color:#000000;height: 200px;margin-top: -2%">
  <br />
  <p style="font-size: 30px;font-weight: 700;color:white" align="center">{{ text.s_assign_button }}</p>
</div>

<ion-card mode="ios" style="background-color: white;padding: 10px 10px;margin-top: -12%">
  <form #form2="ngForm" (ngSubmit)="assign_ext(form2.value)">
    <ion-item class="staff_ext_sel">
      <ion-label>Asigna un Repartidor</ion-label>
      <ion-select placeholder="Select" ngModel name="type_staff" required interface="action-sheet">
        <ion-select-option>
          Selecciona el tipo de repartidor que deseas
        </ion-select-option>
        <ion-select-option value="0">
          Auto
        </ion-select-option>
        <ion-select-option value="1">
          Motocicleta
        </ion-select-option>
        <ion-select-option value="2">
          Bicicleta
        </ion-select-option>
        <hr>
      </ion-select>
    </ion-item>
    <br><br>
    <ion-button expand="block" mode="ios" type="submit" [disabled]="!form2.valid">Solicitar un repartidor</ion-button>
  </form>
</ion-card>

</ion-content>
